schema_version: "1.1"
name: kawa-excel
context:
  scaffold_script: przygotuj.sh
graders:
  - name: uzywa-skilla
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?przeglad-hasel"'
  - name: koszt-shopping
    type: regex
    flags: i
    pattern: '712[,.]30'
  - name: wyklucza-ekspres
    type: regex
    flags: mi
    pattern: '(?:^|[|,;/])[ \t]*(?:[-*•]|\d+\.)?[ \t]*[*_`"„“]{0,3}(?:ekspres)[*_`"”“]{0,3}[ \t]*(?:[|,;/]|$)'
  - name: wyklucza-ekspresy
    type: regex
    flags: mi
    pattern: '(?:^|[|,;/])[ \t]*(?:[-*•]|\d+\.)?[ \t]*[*_`"„“]{0,3}(?:ekspresy)[*_`"”“]{0,3}[ \t]*(?:[|,;/]|$)'
  - name: nie-wyklucza-ekspresu
    type: regex
    flags: mi
    match: not_contains
    pattern: '^[ \t]*["\[](?:ekspresu)["\]][ \t]*$'
